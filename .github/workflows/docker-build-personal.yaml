name: Reusable Docker Build (Local)

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Name of the Docker image'
        required: true
        type: string
        default: ${{ github.repository }}
      dockerfile_path:
        description: 'Path to the Dockerfile'
        required: true
        type: string
        default: '.'
      context_path:
        description: 'Path to the build context (default: .)'
        required: false
        type: string
        default: '.'
      git_auth_user:
        description: 'git username'
        required: false
        type: string
      git_auth_token:
        description: 'git token'
        required: false
        type: string

jobs:
  build:
    env:
      DOCKER_BUILDKIT: 1
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and tag Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          secrets: |
            "git_auth_user=${{ inputs.git_auth_user }}"
            "git_auth_token=${{ inputs.git_auth_token }}"

      - name: List Docker images (verify)
        run: docker images | grep ${{ inputs.image_name }}
