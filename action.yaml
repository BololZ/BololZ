name: 'Reusable Docker Build and Push (Local/Remote)'
description: 'Build and optionally push Dockerfile with private dependencies from GitHub repo'

inputs:
  image_name:
    description: 'Name of the Docker image'
    required: true
    default: ${{ github.repository }}
  dockerfile_path:
    description: 'Path to the Dockerfile'
    required: true
    default: '.'
  context_path:
    description: 'Path to the build context (default: .)'
    required: false
    default: '.'
  git_auth_token:
    description: 'git token'
    required: false

runs:
    using: "composite"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=git-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context_path }}
          file: ${{ inputs.dockerfile_path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          secrets: |
            "git_auth_token=${{ inputs.git_auth_token }}"
